name: Deploy NAZM app + landing to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/smartflow-app-development-dKLqM
    paths:
      - 'landing/**'
      - 'nazm-app/**'
      - 'rakiza/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nazm-app/package-lock.json

      - name: Install app dependencies
        working-directory: nazm-app
        run: npm ci

      - name: Build NAZM app
        working-directory: nazm-app
        env:
          BASE: /${{ github.event.repository.name }}/app/
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ secrets.VITE_AZURE_TENANT_ID }}
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r landing/. _site/
          mkdir -p _site/app
          cp -r nazm-app/dist/. _site/app/
          mkdir -p _site/rakiza
          cp -r rakiza/. _site/rakiza/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
