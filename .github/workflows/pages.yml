name: Deploy NAZM app + landing + rakiza-app to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/smartflow-app-development-dKLqM
    paths:
      - 'landing/**'
      - 'nazm-app/**'
      - 'rakiza/**'
      - 'rakiza-app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── NAZM ─────────────────────────────────────────────
      - name: Install NAZM dependencies
        working-directory: nazm-app
        run: npm ci

      - name: Build NAZM app
        working-directory: nazm-app
        env:
          BASE: /${{ github.event.repository.name }}/app/
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ secrets.VITE_AZURE_TENANT_ID }}
        run: npm run build

      # ── Rakiza Expo Web export ───────────────────────────
      - name: Install rakiza-app dependencies
        working-directory: rakiza-app
        run: npm install --no-audit --no-fund

      - name: Export rakiza-app to web
        working-directory: rakiza-app
        env:
          EXPO_PUBLIC_BASE_PATH: /claude-mem/rakiza-web/
        run: npx expo export --platform web

      # ── Assemble ────────────────────────────────────────
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r landing/. _site/

          mkdir -p _site/app
          cp -r nazm-app/dist/. _site/app/

          mkdir -p _site/rakiza
          cp -r rakiza/. _site/rakiza/

          if [ -d rakiza-app/dist ]; then
            mkdir -p _site/rakiza-web
            cp -r rakiza-app/dist/. _site/rakiza-web/
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
