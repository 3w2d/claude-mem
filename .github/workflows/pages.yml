name: Deploy landing + SmartFlow app to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/smartflow-app-development-dKLqM
    paths:
      - 'landing/**'
      - 'smartflow-app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smartflow-app/package-lock.json

      - name: Install app dependencies
        working-directory: smartflow-app
        run: npm ci

      - name: Build SmartFlow app
        working-directory: smartflow-app
        env:
          BASE: /${{ github.event.repository.name }}/app/
          VITE_AI_ENABLED: 'false'
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r landing/. _site/
          mkdir -p _site/app
          cp -r smartflow-app/dist/. _site/app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
