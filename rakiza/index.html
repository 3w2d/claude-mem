<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fcfcfd">
    <title>رَكيزة | المنصة الهندسة المشرقة</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        :root {
            --bg-main: #fcfcfd;
            --accent-blue: #0056f7;
            --accent-blue-hover: #0046cc;
            --text-dark: #1a1e23;
            --text-muted: #64748b;
            --glass-white: rgba(255, 255, 255, 0.7);
            --border-light: rgba(0, 86, 247, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { width: 100%; }
        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        .blueprint-grid {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(var(--border-light) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-light) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            opacity: 0.5;
        }

        header {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 15px 5%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(252, 252, 253, 0.8);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-light); z-index: 1000;
        }
        .logo { font-size: 24px; font-weight: 700; color: var(--accent-blue); letter-spacing: -1px; }

        .btn-login {
            background: var(--accent-blue); color: #fff; padding: 10px 24px;
            border-radius: 6px; font-weight: 600; font-size: 14px;
            border: none; cursor: pointer; transition: 0.3s;
        }
        .btn-login:hover { background: var(--accent-blue-hover); transform: translateY(-1px); }

        section { min-height: 100vh; min-height: 100dvh; padding: 120px 5% 60px; display: flex; flex-direction: column; justify-content: center; }

        .hero-wrap { max-width: 800px; opacity: 0; transform: translateY(30px); }
        .hero-wrap h1 { font-size: 4.5rem; line-height: 1.1; font-weight: 700; margin-bottom: 25px; color: var(--text-dark); }
        .hero-wrap h1 span { color: var(--accent-blue); }
        .hero-wrap p { font-size: 1.3rem; color: var(--text-muted); max-width: 600px; line-height: 1.6; margin-bottom: 40px; }

        .app-container {
            background: var(--glass-white);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: 30px; padding: 60px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
            display: grid; grid-template-columns: 1fr 1fr; gap: 60px;
            position: relative;
            opacity: 0; transform: translateY(30px);
        }

        .input-box h3 { margin-bottom: 30px; font-size: 1.5rem; color: var(--accent-blue); }
        .field { margin-bottom: 25px; }
        .field label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 10px; color: var(--text-muted); }
        .field input {
            width: 100%; padding: 18px; border-radius: 12px; border: 1px solid #e2e8f0;
            background: #fff; font-size: 16px; font-family: 'IBM Plex Mono';
            transition: 0.3s; color: var(--accent-blue); text-align: left; direction: ltr;
            -webkit-appearance: none; appearance: none;
        }
        .field input:focus { border-color: var(--accent-blue); outline: none; box-shadow: 0 0 0 4px rgba(0, 86, 247, 0.1); }

        .btn-calc {
            width: 100%; padding: 20px; background: var(--accent-blue); color: #fff;
            border: none; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer;
            transition: 0.3s;
        }
        .btn-calc:hover { background: var(--accent-blue-hover); transform: translateY(-1px); }

        .results-panel { display: flex; flex-direction: column; justify-content: center; gap: 30px; }
        .result-item { padding-bottom: 25px; border-bottom: 1px dashed #e2e8f0; }
        .result-item:last-child { border-bottom: none; }
        .res-label { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
        .res-value { font-size: 42px; font-weight: 700; color: var(--text-dark); font-family: 'IBM Plex Mono'; }
        .res-value--accent { color: var(--accent-blue); }
        .res-value .unit { color: var(--accent-blue); font-size: 18px; margin-right: 5px; }

        #canvas-3d {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }

        @media (max-width: 900px) {
            section { padding: 100px 5% 40px; }
            .hero-wrap h1 { font-size: 2.8rem; }
            .hero-wrap p { font-size: 1.1rem; }
            .app-container { grid-template-columns: 1fr; padding: 30px; gap: 30px; border-radius: 20px; }
            .res-value { font-size: 32px; }
        }
        @media (max-width: 540px) {
            header { padding: 12px 5%; }
            .logo { font-size: 20px; }
            .btn-login { padding: 8px 18px; font-size: 13px; }
            .hero-wrap h1 { font-size: 2.1rem; }
            .hero-wrap p { font-size: 1rem; }
            .app-container { padding: 22px; }
            .res-value { font-size: 26px; }
            .field input, .btn-calc { padding: 14px; }
        }
    </style>
</head>
<body>

    <div class="blueprint-grid"></div>
    <div id="canvas-3d"></div>

    <header>
        <div class="logo">رَكيزة</div>
        <button class="btn-login">تسجيل الدخول</button>
    </header>

    <section id="hero">
        <div class="hero-wrap gsap-reveal">
            <h1>هندسة الكميات<br>بأسلوب <span>ذكي ونقي.</span></h1>
            <p>حوّل بيانات مشروعك الإنشائي إلى تقارير دقيقة وفورية. "ركيزة" تمنحك الأرقام التي تحتاجها لبدء البناء بكل ثقة.</p>
        </div>
    </section>

    <section id="app">
        <div class="app-container gsap-reveal">
            <div class="input-box">
                <h3>حساب المشروع</h3>
                <div class="field">
                    <label>مساحة مسطح البناء (M²)</label>
                    <input type="number" id="areaInput" value="500">
                </div>
                <div class="field">
                    <label>عدد الأدوار الإجمالي</label>
                    <input type="number" id="floorsInput" value="2">
                </div>
                <button class="btn-calc" id="calcBtn">إجراء التحليل الإنشائي</button>
            </div>

            <div class="results-panel">
                <div class="result-item">
                    <div class="res-label">حجم الخرسانة المطلوب</div>
                    <div class="res-value"><span id="resConc">--</span> <span class="unit">M³</span></div>
                </div>
                <div class="result-item">
                    <div class="res-label">وزن حديد التسليح التقديري</div>
                    <div class="res-value"><span id="resSteel">--</span> <span class="unit">TON</span></div>
                </div>
                <div class="result-item">
                    <div class="res-label">تكلفة هيكل العظم (SAR)</div>
                    <div class="res-value res-value--accent" id="resCost">--</div>
                </div>
            </div>
        </div>
    </section>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const MOBILE_BP = 900;
        const MAX_FLOORS = 50;
        const mobileMQ = window.matchMedia(`(max-width: ${MOBILE_BP}px)`);
        const isMobile = () => mobileMQ.matches;

        const $ = (id) => document.getElementById(id);
        const els = {
            canvas: $('canvas-3d'),
            calcBtn: $('calcBtn'),
            area: $('areaInput'),
            floors: $('floorsInput'),
            conc: $('resConc'),
            steel: $('resSteel'),
            cost: $('resCost'),
        };

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(40, 30, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: !isMobile(), alpha: true, powerPreference: 'low-power' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile() ? 1.5 : 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        els.canvas.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0x0056f7, 1);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const building = new THREE.Group();
        scene.add(building);

        function positionBuilding() {
            building.position.x = isMobile() ? 0 : 20;
            building.position.y = isMobile() ? -10 : 0;
        }

        function drawBuilding(side, floors) {
            const old = building.children[0];
            if (old) {
                old.geometry.dispose();
                old.material.dispose();
            }
            while (building.children.length > 0) building.remove(building.children[0]);

            const h = 3.5;
            const geo = new THREE.BoxGeometry(side, h, side);
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0x0056f7, transparent: true, opacity: 0.05, roughness: 0, metalness: 0.1, wireframe: true
            });
            for (let i = 0; i < floors; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = (i * h) + h / 2;
                building.add(mesh);
            }
            positionBuilding();
        }
        drawBuilding(25, 4);

        let rafId;
        function animate() {
            rafId = requestAnimationFrame(animate);
            building.rotation.y += 0.001;
            renderer.render(scene, camera);
        }
        animate();

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                cancelAnimationFrame(rafId);
            } else {
                animate();
            }
        });

        gsap.to(".gsap-reveal", { opacity: 1, y: 0, duration: 1, stagger: 0.3, ease: "power3.out" });

        if (!isMobile()) {
            gsap.to(camera.position, {
                z: 70, x: -20,
                scrollTrigger: { trigger: "body", start: "top top", end: "bottom bottom", scrub: 2 }
            });
        }

        const fmt = new Intl.NumberFormat();

        els.calcBtn.addEventListener('click', () => {
            const area = Math.max(0, parseFloat(els.area.value) || 0);
            const floors = Math.min(MAX_FLOORS, Math.max(1, parseInt(els.floors.value, 10) || 1));
            if (area <= 0) return;

            const tArea = area * floors;
            const concrete = tArea * 0.145;

            els.conc.textContent = concrete.toFixed(1);
            els.steel.textContent = ((concrete * 115) / 1000).toFixed(2);
            els.cost.textContent = fmt.format(tArea * 1250);

            drawBuilding(Math.sqrt(area) / 2, floors);
            gsap.from(".result-item", { opacity: 0, x: 20, stagger: 0.1, duration: 0.8 });
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                positionBuilding();
            }, 150);
        }, { passive: true });
    </script>
</body>
</html>
