<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAZM PRO | نَظْم المطور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root[data-theme="dark"] {
            --bg: #0d0d12; --card: #1a1a24; --primary: #9d7cff; --text: #ffffff; --dim: #8e8ea0; --border: #2a2a35;
        }
        :root[data-theme="light"] {
            --bg: #f4f7fe; --card: #ffffff; --primary: #6366f1; --text: #1a1a24; --dim: #64748b; --border: #e2e8f0;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }

        /* Header UI */
        .top-bar { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .chip { background: var(--card); padding: 8px 15px; border-radius: 20px; border: 1px solid var(--border); font-size: 0.8rem; }
        
        .main-card { margin: 20px; background: var(--card); border-radius: 24px; padding: 25px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .user-tag { background: rgba(157, 124, 255, 0.1); color: var(--primary); padding: 4px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: bold; }

        /* Stats Section */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px; }
        .stat-box { background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid var(--border); text-align: center; }
        .stat-num { font-size: 1.4rem; font-weight: 800; color: var(--primary); display: block; }
        .stat-label { font-size: 0.65rem; color: var(--dim); margin-top: 5px; }

        /* AI Notification Area */
        .ai-pulse { margin: 20px; padding: 20px; border-radius: 24px; background: linear-gradient(145deg, var(--card), #1e1e2e); border: 1px solid var(--primary); position: relative; }
        .ai-badge { position: absolute; top: -10px; right: 20px; background: var(--primary); color: white; padding: 2px 10px; border-radius: 10px; font-size: 0.7rem; }

        /* Dynamic Pages */
        .page { display: none; padding: 20px; animation: slideUp 0.4s ease; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

        /* Navigation */
        .nav-bar { position: fixed; bottom: 15px; left: 15px; right: 15px; background: rgba(26, 26, 36, 0.8); backdrop-filter: blur(15px); border-radius: 25px; display: flex; justify-content: space-around; padding: 12px; border: 1px solid var(--border); }
        .nav-btn { color: var(--dim); border: none; background: none; font-size: 1.2rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.7rem; }
        .nav-btn.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="chip">English 🌐</div>
    <div style="font-weight: 900; letter-spacing: 2px;">NAZM</div>
    <button class="chip" onclick="toggleTheme()" id="themeBtn"><i class="fas fa-moon"></i></button>
</div>

<div id="p-home" class="page active">
    <div class="main-card">
        <span class="user-tag">Project Manager</span>
        <h1 style="margin-top:10px;">مرحباً، م. عوض</h1>
        <p style="color:var(--dim); font-size:0.9rem;">إدارة 32 مكتباً بين يديك الآن.</p>
    </div>

    <div class="stats">
        <div class="stat-box"><span class="stat-num">142</span><span class="stat-label">مطالبة</span></div>
        <div class="stat-box"><span class="stat-num">32</span><span class="stat-label">مكتب</span></div>
        <div class="stat-box"><span class="stat-num">63</span><span class="stat-label">موظف</span></div>
    </div>

    <div class="ai-pulse">
        <span class="ai-badge">LIVE AI</span>
        <h3 style="margin-bottom:10px;"><i class="fas fa-microchip"></i> تحليل الميدان</h3>
        <p style="font-size:0.85rem; line-height:1.5; color:var(--dim);">هناك تداخل في 3 مواعيد صيانة بمنطقة مكة المكرمة. هل تريدني أن أقوم بإعادة الجدولة تلقائياً؟</p>
        <button style="margin-top:15px; width:100%; padding:12px; border-radius:12px; border:none; background:var(--primary); color:white; font-weight:bold;">نعم، ابدأ المعالجة</button>
    </div>
</div>

<div id="p-data" class="page">
    <h2><i class="fas fa-database"></i> جداول البيانات</h2>
    <div style="margin-top:20px; background:var(--card); padding:20px; border-radius:20px; border:1px dashed var(--border); text-align:center;">
        <p style="color:var(--dim);">جاري سحب بيانات الـ 142 مطالبة من السيرفر...</p>
    </div>
</div>

<nav class="nav-bar">
    <button class="nav-btn active" onclick="nav('p-home', this)"><i class="fas fa-th-large"></i>الرئيسية</button>
    <button class="nav-btn" onclick="nav('p-data', this)"><i class="fas fa-file-invoice-dollar"></i>المطالبات</button>
    <button class="nav-btn" onclick="nav('p-settings', this)"><i class="fas fa-user-gear"></i>الإعدادات</button>
</nav>

<script>
    function nav(pageId, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function toggleTheme() {
        const h = document.documentElement;
        const b = document.getElementById('themeBtn');
        if(h.getAttribute('data-theme') === 'dark') {
            h.setAttribute('data-theme', 'light');
            b.innerHTML = '<i class="fas fa-sun"></i>';
        } else {
            h.setAttribute('data-theme', 'dark');
            b.innerHTML = '<i class="fas fa-moon"></i>';
        }
    }
</script>
</body>
</html>
